<div class="page-wrapper">
  <div class="modern-card">

    <div class="card-header">
      <div class="icon-circle">
        <i class="bi bi-journal-bookmark"></i>
      </div>
      <h3>Gestion des Enseignements</h3>
      <p>Matière • Classe • Enseignant</p>
    </div>

    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form">
        <div class="form-grid">

          <div class="form-group">
            <label>Matière</label>
            <select class="form-control" formControlName="matiereId">
              <option [ngValue]="null" disabled>-- Sélectionner --</option>
              <option *ngFor="let m of matieres" [value]="m.id">{{ m.intitule }}</option>
            </select>
          </div>

          <div class="form-group">
            <label>Classe</label>
            <select class="form-control" formControlName="classeId">
              <option [ngValue]="null" disabled>-- Sélectionner --</option>
              <option *ngFor="let c of classes" [value]="c.id">{{ c.code }}</option>
            </select>
          </div>

          <div class="form-group">
            <label>Enseignant</label>
            <select class="form-control" formControlName="enseignantId">
              <option [ngValue]="null" disabled>-- Sélectionner --</option>
              <option *ngFor="let e of enseignants" [value]="e.id">
                {{ e?.nom }} {{ e?.prenom }}
              </option>
            </select>
          </div>

        </div>

        <div class="btn-center">
          <button class="btn btn-gradient" type="submit" [disabled]="form.invalid || loading">
            <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
            {{ editingId ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>

      <!-- TABLE -->
      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Matière <input class="table-filter" [(ngModel)]="filterMatiere" [ngModelOptions]="{standalone:true}" (input)="applyFilters()"></th>
              <th>Classe <input class="table-filter" [(ngModel)]="filterClasse" [ngModelOptions]="{standalone:true}" (input)="applyFilters()"></th>
              <th>Enseignant <input class="table-filter" [(ngModel)]="filterEnseignant" [ngModelOptions]="{standalone:true}" (input)="applyFilters()"></th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let e of filteredEnseignements; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ e.matiereIntitule }}</td>
              <td>{{ e.classeCode }}</td>
              <td>{{ e.enseignantNom }}</td>
              <td>
                <button class="btn-edit" (click)="edit(e)"><i class="bi bi-pencil-square"></i></button>
                <button class="btn-delete" (click)="desactiver(e.id!)"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
