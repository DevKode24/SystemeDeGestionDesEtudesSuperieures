<div class="page-wrapper">
  <div class="modern-card">

    <!-- HEADER -->
    <div class="card-header">
      <div class="icon-circle">
        <i class="bi bi-calendar2-week-fill"></i>
      </div>
      <h3>Gestion des Semestres Académiques</h3>
      <p>Organisation des semestres par année académique</p>
    </div>

    <!-- BODY -->
    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form">
        <div class="form-grid">

          <div class="form-group">
            <label>Numéro du semestre</label>
            <select class="form-control" formControlName="numero">
              <option [ngValue]="null">Sélectionner</option>
              <option *ngFor="let n of [1,2,3,4,5,6]" [ngValue]="n">Semestre {{ n }}</option>
            </select>
          </div>

          <div class="form-group">
            <label>Année académique</label>
            <select class="form-control" formControlName="anneeAcademiqueId">
              <option [ngValue]="null">Sélectionner</option>
              <option *ngFor="let a of anneesAcademiques" [ngValue]="a.id">{{ a.libelle }}</option>
            </select>
          </div>

        </div>

        <div class="btn-center">
          <button type="submit" class="btn-gradient" [disabled]="form.invalid || loading">
            <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
            {{ editingId ? 'Mettre à jour' : 'Ajouter le semestre' }}
          </button>
        </div>
      </form>

      <!-- BARRE D’ACTIONS -->
      <div class="table-toolbar">

        <input type="text" class="search-input" placeholder="🔎 Rechercher semestre ou année..."
               [(ngModel)]="searchTerm" [ngModelOptions]="{ standalone: true }" (input)="applyFilter()" />

        <div class="toolbar-actions">

          <!-- Importer -->
          <label class="btn-action import">
            <i class="bi bi-upload"></i> Importer
            <input type="file" hidden (change)="importExcel($event)" />
          </label>

           <div class="d-flex gap-2">
          <button class="btn btn-outline-success" (click)="export('excel')">
            <i class="bi bi-file-earmark-excel-fill"></i> Excel
          </button>

          <button class="btn btn-outline-secondary" (click)="export('csv')">
            <i class="bi bi-filetype-csv"></i> CSV
          </button>

          <button class="btn btn-outline-danger" (click)="export('pdf')">
            <i class="bi bi-file-earmark-pdf-fill"></i> PDF
          </button>

          <label class="btn btn-outline-primary mb-0">
            <i class="bi bi-upload"></i> Import
            <input type="file" hidden accept=".xlsx,.csv" (change)="importExcel($event)">
          </label>
        </div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Semestre</th>
              <th>Année académique</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let s of paginatedData(); let i = index">
              <td>{{ i + 1 + (page - 1) * pageSize }}</td>
              <td><span class="badge-semestre">Semestre {{ s.numero }}</span></td>
              <td>{{ s.anneeAcademique?.libelle }}</td>
              <td class="text-end">
                <button class="icon-btn edit" (click)="edit(s)"><i class="bi bi-pencil-fill"></i></button>
                <button class="icon-btn delete" (click)="delete(s.id!)"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>
            <tr *ngIf="filteredSemestres.length === 0">
              <td colspan="4" class="empty-state">
                <i class="bi bi-inbox-fill"></i> Aucun semestre trouvé
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="pagination-bar">
        <button class="page-btn" (click)="page = page - 1" [disabled]="page === 1">Précédent</button>
        <span class="page-info">Page {{ page }} / {{ totalPages() }}</span>
        <button class="page-btn" (click)="page = page + 1" [disabled]="page === totalPages()">Suivant</button>
        <select class="form-control page-size-select" [(ngModel)]="pageSize" (change)="page=1">
          <option *ngFor="let size of pageSizes" [value]="size">{{ size }} / page</option>
        </select>
      </div>

    </div>
  </div>
</div>
