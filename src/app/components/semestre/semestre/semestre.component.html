<div class="page-wrapper">
  <div class="card modern-card">

    <!-- ================= HEADER ================= -->
    <div class="card-header text-center">
      <div class="icon-circle mb-3">
        <i class="bi bi-calendar2-week-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Semestres Académiques</h3>
      <p class="text-muted small">
        Gestion centralisée des semestres par année académique
      </p>
    </div>

    <!-- ================= FORM ================= -->
    <div class="card-body">
      <form
        [formGroup]="form"
        (ngSubmit)="save()"
        class="modern-form mb-4"
      >

        <div class="row g-3">

          <!-- Numéro semestre -->
          <div class="col-md-6">
            <div class="form-floating">
              <select
                class="form-select"
                formControlName="numero"
              >
                <option [ngValue]="null">Sélectionner le semestre</option>
                <option *ngFor="let n of [1,2,3,4,5,6]" [ngValue]="n">
                  Semestre {{ n }}
                </option>
              </select>
              <label>Numéro du semestre</label>
            </div>
            <small
              class="text-danger"
              *ngIf="form.get('numero')?.touched && form.get('numero')?.invalid"
            >
              Le numéro du semestre est obligatoire
            </small>
          </div>

          <!-- Année académique -->
          <div class="col-md-6">
            <div class="form-floating">
              <select
                class="form-select"
                formControlName="anneeAcademiqueId"
              >
                <option [ngValue]="null">Sélectionner l'année académique</option>
                <option
                  *ngFor="let a of anneesAcademiques"
                  [ngValue]="a.id"
                >
                  {{ a.libelle }}
                </option>
              </select>
              <label>Année académique</label>
            </div>
            <small
              class="text-danger"
              *ngIf="form.get('anneeAcademiqueId')?.touched && form.get('anneeAcademiqueId')?.invalid"
            >
              L'année académique est obligatoire
            </small>
          </div>

        </div>

        <!-- Bouton submit -->
        <button
          type="submit"
          class="btn btn-gradient w-100 mt-4"
          [disabled]="form.invalid || loading || !canEdit()"
        >
          <i
            class="bi me-1"
            [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"
          ></i>
          {{ editingId ? 'Modifier le semestre' : 'Ajouter un semestre' }}
        </button>

      </form>
  <div class="d-flex justify-content-end mb-3 gap-2">
          <button class="btn btn-warning"><i class="bi bi-upload me-1"></i>Importer</button>
          <button class="btn btn-success"><i class="bi bi-download me-1"></i>Exporter</button>
        </div>
      <!-- ================= TABLE ================= -->
      <div class="table-responsive modern-table">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Semestre</th>
              <th>Année académique</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let s of semestres; let i = index">
              <td>{{ i + 1 }}</td>
              <td>Semestre {{ s.numero }}</td>
              <td>{{ s.anneeAcademique?.libelle }}</td>
              <td class="text-end">

                <button
                  class="btn btn-action edit me-2"
                  (click)="edit(s)"
                  *ngIf="canEdit()"
                >
                  <i class="bi bi-pencil-fill"></i>
                </button>

                <button
                  class="btn btn-action delete"
                  (click)="delete(s.id!)"
                  *ngIf="canEdit()"
                >
                  <i class="bi bi-trash-fill"></i>
                </button>

              </td>
            </tr>

            <!-- Aucun résultat -->
            <tr *ngIf="semestres.length === 0">
              <td colspan="4" class="text-center text-muted py-5">
                <i class="bi bi-inbox-fill me-2"></i>
                Aucun semestre trouvé
              </td>
            </tr>

          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
