<div class="page-wrapper">
  <div class="card modern-card">

    <!-- ================= HEADER ================= -->
    <div class="card-header text-center">
      <div class="icon-circle mb-3">
        <i class="bi bi-diagram-3-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Filières Académiques</h3>
      <p class="text-muted small">
        Gestion centralisée des filières
      </p>
    </div>

    <div class="card-body">

      <!-- ================= FORM ================= -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form mb-4">
        <div class="row g-3">

          <div class="col-md-4">
            <div class="form-floating">
              <input class="form-control" formControlName="nom" placeholder="Nom">
              <label>Nom de la filière</label>
            </div>
          </div>

          <div class="col-md-4">
            <div class="form-floating">
              <input class="form-control" formControlName="code" placeholder="Code">
              <label>Code</label>
            </div>
          </div>

          <div class="col-md-4">
            <div class="form-floating">
              <input class="form-control" formControlName="description" placeholder="Description">
              <label>Description</label>
            </div>
          </div>

        </div>

        <button class="btn btn-gradient w-100 mt-3" type="submit">
          <i class="bi me-1"
             [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
          {{ editingId ? 'Modifier la filière' : 'Ajouter une filière' }}
        </button>
      </form>

      <!-- ================= SEARCH + ACTIONS ================= -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <input
          class="form-control w-50"
          placeholder="🔎 Rechercher par nom ou code..."
          [(ngModel)]="filterValue"
          (ngModelChange)="applyFilters()"
          name="filterValue"
        />

        <div class="d-flex gap-2">
          <label class="btn btn-warning mb-0">
            <i class="bi bi-upload me-1"></i> Import
            <input type="file" hidden (change)="importFile($event)">
          </label>

          <button class="btn btn-success" (click)="exportExcel()">
            <i class="bi bi-file-earmark-excel me-1"></i> Excel
          </button>

          <button class="btn btn-secondary" (click)="exportCSV()">
            <i class="bi bi-filetype-csv me-1"></i> CSV
          </button>
        </div>
      </div>

      <!-- ================= TABLE ================= -->
      <div class="table-responsive modern-table">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Nom</th>
              <th>Code</th>
              <th>Description</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let f of pagedFilieres; let i = index">
              <td>{{ (page - 1) * pageSize + i + 1 }}</td>
              <td class="fw-semibold">{{ f.nom }}</td>
              <td>{{ f.code }}</td>
              <td>{{ f.description }}</td>
              <td class="text-end">
                <button class="btn btn-action edit me-2" (click)="edit(f)">
                  <i class="bi bi-pencil-fill"></i>
                </button>
                <button class="btn btn-action delete" (click)="supprimer(f.id!)">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="pagedFilieres.length === 0">
              <td colspan="5" class="text-center text-muted py-4">
                Aucune filière trouvée
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ================= PAGINATION ================= -->
      <div class="d-flex justify-content-between align-items-center mt-3">
        <div>
          Page {{ page }}
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary"
                  (click)="prevPage()"
                  [disabled]="page === 1">
            Précédent
          </button>

          <button class="btn btn-outline-secondary"
                  (click)="nextPage()"
                  [disabled]="page * pageSize >= filteredFilieres.length">
            Suivant
          </button>

          <select class="form-select w-auto"
                  [(ngModel)]="pageSize"
                  (change)="applyFilters()">
            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>
      </div>

    </div>
  </div>
</div>
