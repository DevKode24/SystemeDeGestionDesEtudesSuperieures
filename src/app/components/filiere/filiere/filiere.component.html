<div class="page-wrapper">

  <div class="card modern-card">

    <!-- HEADER -->
    <div class="card-header text-center">
      <div class="icon-circle mb-3">
        <i class="bi bi-building-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Filières Académiques</h3>
      <p class="text-muted small">
        Gestion centralisée des filières universitaires
      </p>
    </div>

    <!-- FORM -->
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="save()" class="mb-3 modern-form">

        <div class="form-floating mb-2">
          <input type="text" class="form-control" placeholder="Informatique" formControlName="nom"/>
          <label>Nom de la filière</label>
        </div>

        <div class="form-floating mb-2">
          <input type="text" class="form-control" placeholder="INFO" formControlName="code"/>
          <label>Code de la filière</label>
        </div>

       

        <button class="btn btn-gradient w-100" type="submit" [disabled]="loading || !canEdit()">
          <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
          {{ editingId ? 'Modifier la filière' : 'Ajouter une filière' }}
        </button>
      </form>

      <!-- TABLE -->
      <!-- 🔍 RECHERCHE -->
<div class="mb-3">
  <input
    type="text"
    class="form-control"
    placeholder="Rechercher une filière..."
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchChange()"
    name="searchTerm"
  />
</div>
  <div class="d-flex justify-content-end mb-3 gap-2">
          <button class="btn btn-warning"><i class="bi bi-upload me-1"></i>Importer</button>
          <button class="btn btn-success"><i class="bi bi-download me-1"></i>Exporter</button>
        </div>
<!-- TABLE -->
<div class="table-responsive modern-table">
  <table class="table align-middle">
    <thead>
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Code</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let filiere of pagedFilieres; let i = index">
        <td>{{ (page - 1) * pageSize + i + 1 }}</td>
        <td class="fw-semibold">{{ filiere.nom }}</td>
        <td>{{ filiere.code }}</td>
        <td class="text-end">
          <button
            class="btn btn-action edit me-1"
            (click)="edit(filiere)"
            [disabled]="!canEdit()">
            <i class="bi bi-pencil-fill"></i>
          </button>

          <button
            class="btn btn-action delete"
            (click)="delete(filiere.id!)"
            [disabled]="!canEdit()">
            <i class="bi bi-trash-fill"></i>
          </button>
        </td>
      </tr>

      <tr *ngIf="pagedFilieres.length === 0">
        <td colspan="4" class="text-center text-muted py-4">
          <i class="bi bi-inbox-fill me-2"></i>
          Aucune filière trouvée
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- PAGINATION -->
<div class="d-flex justify-content-between align-items-center mt-3">
  <nav>
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="page === 1">
        <button class="page-link" (click)="page = page - 1" [disabled]="page === 1">
          Précédent
        </button>
      </li>

      <li class="page-item disabled">
        <span class="page-link">{{ page }}</span>
      </li>

      <li class="page-item"
          [class.disabled]="page * pageSize >= filteredFilieres.length">
        <button class="page-link"
                (click)="page = page + 1"
                [disabled]="page * pageSize >= filteredFilieres.length">
          Suivant
        </button>
      </li>
    </ul>
  </nav>

  <select class="form-select w-auto"
          [(ngModel)]="pageSize"
          (change)="onSearchChange()">
    <option [ngValue]="5">5 / page</option>
    <option [ngValue]="10">10 / page</option>
    <option [ngValue]="20">20 / page</option>
  </select>
</div>


    </div>
  </div>
</div>
