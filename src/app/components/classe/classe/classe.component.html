<div class="page-wrapper">
  <div class="modern-card">

    <!-- HEADER -->
    <div class="card-header">
      <div class="icon-circle">
        <i class="bi bi-building"></i>
      </div>
      <h3>Gestion des Classes</h3>
      <p>Création, modification et consultation des promotions</p>
    </div>

    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form">
        <div class="form-grid">

          <!-- CODE -->
          <div class="form-group">
            <label>Code</label>
            <input class="form-control" formControlName="code" placeholder="Ex: CS101">
          </div>

          <!-- FILIERE -->
          <div class="form-group">
            <label>Filière</label>
            <select class="form-control" formControlName="filiereId">
              <option [ngValue]="null" disabled>-- Sélectionner une filière --</option>
              <option *ngFor="let f of filieres" [value]="f.id">{{ f.nom }}</option>
            </select>
          </div>

          <!-- NIVEAU -->
          <div class="form-group">
            <label>Niveau</label>
            <select class="form-control" formControlName="niveauId">
              <option [ngValue]="null" disabled>-- Sélectionner un niveau --</option>
              <option *ngFor="let n of niveaux" [value]="n.id">{{ n.libelle }}</option>
            </select>
          </div>


        </div>

        <div class="btn-center">
          <button class="btn btn-gradient" type="submit" [disabled]="form.invalid || loading">
            <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
            {{ editingId ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>

      <!-- TABLEAU AVEC FILTRES -->
      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>#</th>
              <th>
                Code
                <input class="table-filter" [(ngModel)]="filterCode" [ngModelOptions]="{standalone:true}" (input)="applyFilters()" placeholder="Filtrer...">
              </th>
              <th>
                Filière
                <input class="table-filter" [(ngModel)]="filterFiliere" [ngModelOptions]="{standalone:true}" (input)="applyFilters()" placeholder="Filtrer...">
              </th>
              <th>
                Niveau
                <input class="table-filter" [(ngModel)]="filterNiveau" [ngModelOptions]="{standalone:true}" (input)="applyFilters()" placeholder="Filtrer...">
              </th>
        
              <th>Actions</th>
            </tr>
          </thead>
     <tbody>
  <tr *ngFor="let c of filteredClasses; let i = index" class="table-row">
    <td>{{ i + 1 }}</td>
    <td>{{ c.code }}</td>
    <td>{{ getFiliereNom(c.filiereId) }}</td>
    <td>{{ getNiveauLibelle(c.niveauId) }}</td>
    <td>
      <button class="btn-edit" (click)="edit(c)" title="Modifier"><i class="bi bi-pencil-square"></i></button>
      <button class="btn-delete" (click)="desactiverClasse(c.id!)" title="Désactiver"><i class="bi bi-trash-fill"></i></button>
    </td>
  </tr>
  <tr *ngIf="filteredClasses.length === 0">
    <td colspan="6" class="text-center">Aucune classe trouvée</td>
  </tr>
</tbody>


        </table>
      </div>

    </div>
  </div>
</div>
