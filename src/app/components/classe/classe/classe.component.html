<div class="page-wrapper">
  <div class="modern-card">

    <!-- HEADER -->
    <div class="card-header text-center">
      <div class="icon-circle">
        <i class="bi bi-building"></i>
      </div>
      <h3 class="fw-bold mt-2">Gestion des Classes</h3>
      <p>Création, modification et consultation des promotions</p>
    </div>

    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form mb-4">
        <div class="form-grid">

          <!-- CODE -->
          <div class="form-group">
            <label>Code</label>
            <input class="form-control" formControlName="code" placeholder="Ex: CS101">
          </div>

          <!-- FILIERE -->
          <div class="form-group">
            <label>Filière</label>
            <select class="form-control" formControlName="filiereId">
              <option [ngValue]="null" disabled>-- Sélectionner une filière --</option>
              <option *ngFor="let f of filieres" [ngValue]="f.id">{{ f.nom }}</option>
            </select>
          </div>

          <!-- NIVEAU -->
          <div class="form-group">
            <label>Niveau</label>
            <select class="form-control" formControlName="niveauId">
              <option [ngValue]="null" disabled>-- Sélectionner un niveau --</option>
              <option *ngFor="let n of niveaux" [ngValue]="n.id">{{ n.libelle }}</option>
            </select>
          </div>

        </div>

        <div class="btn-center mt-3">
          <button class="btn btn-gradient" type="submit" [disabled]="form.invalid || loading">
            <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
            {{ editingId ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>

      <!-- RECHERCHE -->
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <input
          type="text"
          class="form-control w-50"
          placeholder="Rechercher une classe..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          [ngModelOptions]="{standalone:true}"
        />

        <!-- EXPORT / IMPORT -->
        <div class="btn-group">
          <button class="btn btn-success" (click)="exportExcel()">
            <i class="bi bi-file-earmark-excel-fill"></i> Excel
          </button>
          <button class="btn btn-primary" (click)="exportCSV()">
            <i class="bi bi-file-earmark-spreadsheet-fill"></i> CSV
          </button>
          <button class="btn btn-danger" (click)="exportPDF()">
            <i class="bi bi-file-earmark-pdf-fill"></i> PDF
          </button>
          <label class="btn btn-warning mb-0">
            <i class="bi bi-upload"></i> Import
            <input type="file" hidden (change)="importFile($event)" accept=".xlsx,.xls,.csv" />
          </label>
        </div>
      </div>

      <!-- TABLEAU AVEC FILTRES -->
      <div class="table-container">
        <table class="modern-table table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Code</th>
              <th>Filière</th>
              <th>Niveau</th>
              <th>Actif</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let c of pagedClasses; let i = index">
              <td>{{ (page - 1) * pageSize + i + 1 }}</td>
              <td>{{ c.code }}</td>
              <td>{{ c.filiere?.nom }}</td>
              <td>{{ c.niveau?.libelle }}</td>
              <td>
                <span [class.text-success]="c.active" [class.text-danger]="!c.active">
                  {{ c.active ? 'Oui' : 'Non' }}
                </span>
              </td>
              <td>
                <button class="btn-edit btn btn-sm btn-outline-primary me-2" (click)="edit(c)">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn-delete btn btn-sm btn-outline-danger" (click)="desactiverClasse(c.id!)">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="filteredClasses.length === 0">
              <td colspan="6" class="text-center">Aucune classe trouvée</td>
            </tr>
          </tbody>
        </table>

        <!-- PAGINATION -->
        <div class="d-flex justify-content-between align-items-center mt-3">
          <nav>
            <ul class="pagination mb-0">
              <li class="page-item" [class.disabled]="page === 1">
                <button class="page-link" (click)="page = page - 1">Précédent</button>
              </li>
              <li class="page-item disabled">
                <span class="page-link">{{ page }}</span>
              </li>
              <li class="page-item" [class.disabled]="page * pageSize >= filteredClasses.length">
                <button class="page-link" (click)="page = page + 1">Suivant</button>
              </li>
            </ul>
          </nav>

          <select class="form-select w-auto" [(ngModel)]="pageSize" (change)="onSearchChange()" [ngModelOptions]="{standalone:true}">
            <option [ngValue]="5">5 / page</option>
            <option [ngValue]="10">10 / page</option>
            <option [ngValue]="20">20 / page</option>
          </select>
        </div>
      </div>

    </div>
  </div>
</div>
