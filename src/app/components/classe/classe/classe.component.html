<div class="page-wrapper">
  <div class="modern-card">

    <!-- HEADER -->
    <div class="card-header">
      <div class="icon-circle">
        <i class="bi bi-building"></i>
      </div>
      <h3>Gestion des Classes</h3>
      <p>Création, modification et consultation des promotions</p>
    </div>

    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form">
        <div class="form-grid">

          <!-- CODE -->
          <div class="form-group">
            <label>Code</label>
            <input class="form-control" formControlName="code" placeholder="Ex: CS101">
          </div>

       <!-- FILIERE -->
<select class="form-control" formControlName="filiereId">
  <option [ngValue]="null" disabled>-- Sélectionner une filière --</option>
  <option *ngFor="let f of filieres" [ngValue]="f.id">
    {{ f.nom }}
  </option>
</select>

<!-- NIVEAU -->
<select class="form-control" formControlName="niveauId">
  <option [ngValue]="null" disabled>-- Sélectionner un niveau --</option>
  <option *ngFor="let n of niveaux" [ngValue]="n.id">
    {{ n.libelle }}
  </option>
</select>



        </div>

        <div class="btn-center">
          <button class="btn btn-gradient" type="submit" [disabled]="form.invalid || loading">
            <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
            {{ editingId ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>
<div class="mb-3">
  <input
    type="text"
    class="form-control"
    placeholder="Rechercher une classe..."
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchChange()"
    [ngModelOptions]="{standalone:true}"
  />
</div>
      <!-- TABLEAU AVEC FILTRES -->
      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>#</th>
              <th>
                Code
          
              </th>
              <th>
                Filière
          
              </th>
              <th>
                Niveau
            
              </th>
        
              <th>Actions</th>
            </tr>
          </thead>
   <tbody>
  <tr *ngFor="let c of pagedClasses; let i = index">
    <td>{{ (page - 1) * pageSize + i + 1 }}</td>

    <td>{{ c.code }}</td>

    <td>{{ c.filiere?.nom }}</td>

    <td>{{ c.niveau?.libelle }}</td>

    <td>
      <button class="btn-edit" (click)="edit(c)">
        <i class="bi bi-pencil-square"></i>
      </button>

      <button class="btn-delete" (click)="desactiverClasse(c.id!)">
        <i class="bi bi-trash-fill"></i>
      </button>
    </td>
  </tr>

  <tr *ngIf="filteredClasses.length === 0">
    <td colspan="5" class="text-center">Aucune classe trouvée</td>
  </tr>
</tbody>


        </table>
        <div class="d-flex justify-content-between align-items-center mt-3">
  <nav>
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="page === 1">
        <button class="page-link" (click)="page = page - 1">Précédent</button>
      </li>

      <li class="page-item disabled">
        <span class="page-link">{{ page }}</span>
      </li>

      <li class="page-item"
          [class.disabled]="page * pageSize >= filteredClasses.length">
        <button class="page-link" (click)="page = page + 1">Suivant</button>
      </li>
    </ul>
  </nav>

  <select class="form-select w-auto"
          [(ngModel)]="pageSize"
          (change)="onSearchChange()"
          [ngModelOptions]="{standalone:true}">
    <option [ngValue]="5">5 / page</option>
    <option [ngValue]="10">10 / page</option>
    <option [ngValue]="20">20 / page</option>
  </select>
</div>
      </div>

    </div>
  </div>
</div>
