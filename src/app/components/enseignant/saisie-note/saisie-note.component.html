<div class="page-wrapper">
  <div class="modern-card">

    <!-- HEADER -->
    <div class="card-header text-center">
      <div class="icon-circle">
        <i class="bi bi-journal-check"></i>
      </div>
      <h3 class="fw-bold mt-2">Saisie des notes</h3>
      <p>Gestion des évaluations par classe et matière</p>
    </div>

    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" class="modern-form mb-4">
        <div class="row g-3">

          <div class="col-md-3">
            <label class="form-label">
              <i class="bi bi-mortarboard-fill me-1 text-primary"></i>
              Classe
            </label>
            <select class="form-control" formControlName="classeId">
              <option [ngValue]="null">Sélectionner une classe</option>
              <option *ngFor="let c of classes" [ngValue]="c.id">
                {{ c.code }}
              </option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">
              <i class="bi bi-book-fill me-1 text-primary"></i>
              Matière
            </label>
            <select class="form-control" formControlName="matiereId">
              <option [ngValue]="null">Sélectionner une matière</option>
              <option *ngFor="let m of matieres" [ngValue]="m.id">
                {{ m.intitule }} ({{ m.code }})
              </option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">
              <i class="bi bi-calendar-event-fill me-1 text-primary"></i>
              Semestre
            </label>
            <input type="text" class="form-control bg-light" [value]="semestre" disabled>
          </div>

          <div class="col-md-3">
            <label class="form-label">
              <i class="bi bi-calendar-check-fill me-1 text-primary"></i>
              Année académique
            </label>
            <select class="form-control" formControlName="anneeAcademiqueId">
              <option [ngValue]="null">Sélectionner l'année</option>
              <option *ngFor="let a of annees" [ngValue]="a.id">
                {{ a.libelle }}
              </option>
            </select>
          </div>

        </div>
      </form>

      <!-- SPINNER -->
      <div *ngIf="loading" class="text-center my-5">
        <div class="spinner-border text-primary"></div>
      </div>

      <!-- TABLE -->
      <div *ngIf="lignes.length > 0 && !loading" class="table-container">

        <form [formGroup]="form">
          <table class="modern-table">
            <thead class="notes-thead">
              <tr>
                <th>#</th>
                <th class="text-start">
                  <i class="bi bi-person-fill me-1"></i> Étudiant
                </th>
                <th>
                  <i class="bi bi-pencil-square me-1"></i> Devoir
                </th>
                <th>
                  <i class="bi bi-check-circle me-1"></i> Session Ordinaire
                </th>
                <th>
                  <i class="bi bi-arrow-repeat me-1"></i> Rattrapage
                </th>
                <th>
                  <i class="bi bi-award-fill me-1"></i> Note Finale
                </th>
              </tr>
            </thead>

            <tbody formArrayName="lignes">
              <tr *ngFor="let control of lignesForm.controls; let i = index" [formGroupName]="i">

                <td>{{ i + 1 }}</td>

                <td class="text-start fw-semibold">
                  <i class="bi bi-person-circle me-1 text-primary"></i>
                  {{ lignes[i].nomPrenom }}
                </td>

                <td>
                  <input type="number" min="0" max="20"
                         class="form-control"
                         formControlName="noteDevoir">
                </td>

                <td>
                  <input type="number" min="0" max="20"
                         class="form-control"
                         formControlName="noteSessionOrdinaire">
                </td>

                <td>
                  <input type="number" min="0" max="20"
                         class="form-control"
                         formControlName="noteSessionRattrapage">
                </td>

                <td class="fw-bold">
                  {{ lignes[i].noteFinale }}
                </td>

              </tr>
            </tbody>
          </table>
        </form>

        <!-- PAGINATION -->
        <div class="pagination-bar" *ngIf="lignes.length > pageSize">
          <button class="page-btn" (click)="prevPage($event)" [disabled]="currentPage === 1">←</button>
          <span class="page-info">{{ currentPage }} / {{ totalPages() }}</span>
          <button class="page-btn" (click)="nextPage($event)" [disabled]="currentPage === totalPages()">→</button>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="btn-center mt-4 text-end">
          <button class="btn-gradient me-2" (click)="enregistrer()" [disabled]="form.invalid || loading">
            <i class="bi bi-save-fill"></i> Enregistrer
          </button>
          <button class="btn-gradient" (click)="imprimer()">
            <i class="bi bi-printer-fill"></i> Imprimer
          </button>
        </div>

      </div>

      <!-- MESSAGE -->
      <div *ngIf="!loading && lignes.length === 0"
           class="alert text-center mt-4"
           style="background:#eef2ff; border-radius:14px;">
        Sélectionnez classe + matière + année académique.
      </div>

    </div>
  </div>
</div>
