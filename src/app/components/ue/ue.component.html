<div class="page-wrapper">

  <div class="card modern-card">

    <!-- HEADER -->
    <div class="card-header text-center">
      <div class="icon-circle mb-3">
        <i class="bi bi-journal-richtext"></i>
      </div>
      <h3 class="fw-bold mb-1">Unités d’Enseignement</h3>
      <p class="text-muted small">
        Gestion des UE (création, modification, suppression)
      </p>
    </div>

    <!-- BODY -->
    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="mb-4 modern-form">

        <div class="row g-2">

          <div class="col-md-4">
            <div class="form-floating">
              <input type="text" class="form-control" formControlName="code">
              <label>Code UE</label>
            </div>
          </div>

          <div class="col-md-8">
            <div class="form-floating">
              <input type="text" class="form-control" formControlName="intitule">
              <label>Intitulé</label>
            </div>
          </div>

          <div class="col-md-3">
            <div class="form-floating">
              <input type="number" class="form-control" formControlName="credit">
              <label>Crédits</label>
            </div>
          </div>

          <div class="col-md-3">
            <div class="form-floating">
              <select class="form-select" formControlName="semestreId">
                <option [ngValue]="null">Sélectionner</option>
                <option *ngFor="let s of semestres" [ngValue]="s.id">
                  Semestre {{ s.numero }}
                </option>
              </select>
              <label>Semestre</label>
            </div>
          </div>

          <div class="col-md-3">
            <div class="form-floating">
              <select class="form-select" formControlName="filiereId">
                <option [ngValue]="null">Sélectionner</option>
                <option *ngFor="let f of filieres" [ngValue]="f.id">
                  {{ f.nom }}
                </option>
              </select>
              <label>Filière</label>
            </div>
          </div>

          <div class="col-md-3">
            <div class="form-floating">
              <select class="form-select" formControlName="niveauId">
                <option [ngValue]="null">Sélectionner</option>
                <option *ngFor="let n of niveaux" [ngValue]="n.id">
                  {{ n.libelle }}
                </option>
              </select>
              <label>Niveau</label>
            </div>
          </div>

        </div>

        <button
          class="btn btn-gradient w-100 mt-3"
          type="submit"
          [disabled]="loading || !canEdit()">
          <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
          {{ editingId ? 'Modifier l’UE' : 'Ajouter une UE' }}
        </button>

      </form>

      <!-- 🔍 RECHERCHE -->
      <div class="mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Rechercher une UE (code ou intitulé)..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          name="searchTerm"
        />
      </div>

      <!-- TABLE -->
      <div class="table-responsive modern-table">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Code</th>
              <th>Intitulé</th>
              <th>Crédits</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let ue of pagedUes; let i = index">
              <td>{{ (page - 1) * pageSize + i + 1 }}</td>
              <td class="fw-semibold">{{ ue.code }}</td>
              <td>{{ ue.intitule }}</td>
              <td>{{ ue.credit }}</td>

              <td class="text-end">
                <button
                  class="btn btn-action edit me-1"
                  (click)="edit(ue)"
                  [disabled]="!canEdit()">
                  <i class="bi bi-pencil-fill"></i>
                </button>

                <button
                  class="btn btn-action delete"
                  (click)="delete(ue.id!)"
                  [disabled]="!canEdit()">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="pagedUes.length === 0">
              <td colspan="5" class="text-center text-muted py-4">
                <i class="bi bi-inbox-fill me-2"></i>
                Aucune UE trouvée
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="d-flex justify-content-between align-items-center mt-3">
        <nav>
          <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="page === 1">
              <button class="page-link"
                      (click)="page = page - 1"
                      [disabled]="page === 1">
                Précédent
              </button>
            </li>

            <li class="page-item disabled">
              <span class="page-link">{{ page }}</span>
            </li>

            <li class="page-item"
                [class.disabled]="page * pageSize >= filteredUes.length">
              <button class="page-link"
                      (click)="page = page + 1"
                      [disabled]="page * pageSize >= filteredUes.length">
                Suivant
              </button>
            </li>
          </ul>
        </nav>

        <select class="form-select w-auto"
                [(ngModel)]="pageSize"
                (change)="onSearchChange()">
          <option [ngValue]="5">5 / page</option>
          <option [ngValue]="10">10 / page</option>
          <option [ngValue]="20">20 / page</option>
        </select>
      </div>

    </div>
  </div>
</div>
