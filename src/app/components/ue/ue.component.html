<div class="page-wrapper">
  <div class="modern-card">

    <!-- HEADER -->
    <div class="card-header text-center">
      <div class="icon-circle">
        <i class="bi bi-journal-richtext"></i>
      </div>
      <h3 class="fw-bold mt-2">Unités d’Enseignement</h3>
      <p>Gestion complète des UE</p>
    </div>

    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form mb-4">
        <div class="row g-2">
          <div class="col-md-4">
            <input class="form-control" placeholder="Code UE" formControlName="code">
          </div>
          <div class="col-md-8">
            <input class="form-control" placeholder="Intitulé" formControlName="intitule">
          </div>
          <div class="col-md-3">
            <input type="number" class="form-control" placeholder="Crédits" formControlName="credit">
          </div>
          <div class="col-md-3">
            <select class="form-control" formControlName="semestreId">
              <option [ngValue]="null">Semestre</option>
              <option *ngFor="let s of semestres" [ngValue]="s.id">S{{ s.numero }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-control" formControlName="filiereId">
              <option [ngValue]="null">Filière</option>
              <option *ngFor="let f of filieres" [ngValue]="f.id">{{ f.nom }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-control" formControlName="niveauId">
              <option [ngValue]="null">Niveau</option>
              <option *ngFor="let n of niveaux" [ngValue]="n.id">{{ n.libelle }}</option>
            </select>
          </div>
        </div>

        <button class="btn btn-gradient w-100 mt-3" [disabled]="!canEdit()">
          <i class="bi bi-save-fill"></i> {{ editingId ? 'Modifier' : 'Ajouter' }}
        </button>
      </form>

      <!-- 🔍 RECHERCHE + EXPORT -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <input
          class="form-control w-50"
          placeholder="Rechercher une UE..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          [ngModelOptions]="{standalone:true}"
        />

        <div class="btn-group">
          <button class="btn btn-success" (click)="exportExcel()">Excel</button>
          <button class="btn btn-primary" (click)="exportCSV()">CSV</button>
          <button class="btn btn-danger" (click)="exportPDF()">PDF</button>
          <label class="btn btn-warning mb-0">
            Import
            <input type="file" hidden (change)="importFile($event)">
          </label>
        </div>
      </div>

      <!-- TABLE -->
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Code</th>
            <th>Intitulé</th>
            <th>Crédits</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let ue of pagedUes; let i = index">
            <td>{{ (page - 1) * pageSize + i + 1 }}</td>
            <td>{{ ue.code }}</td>
            <td>{{ ue.intitule }}</td>
            <td>{{ ue.credit }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1" (click)="edit(ue)">✏️</button>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(ue.id!)">🗑</button>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- PAGINATION -->
      <div class="d-flex justify-content-between align-items-center mt-3">
        <nav>
          <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="page === 1">
              <button class="page-link"
                      (click)="page = page - 1"
                      [disabled]="page === 1">
                Précédent
              </button>
            </li>

            <li class="page-item disabled">
              <span class="page-link">{{ page }}</span>
            </li>

            <li class="page-item"
                [class.disabled]="page * pageSize >= filteredUes.length">
              <button class="page-link"
                      (click)="page = page + 1"
                      [disabled]="page * pageSize >= filteredUes.length">
                Suivant
              </button>
            </li>
          </ul>
        </nav>

        <select class="form-select w-auto"
                [(ngModel)]="pageSize"
                (change)="onSearchChange()">
          <option [ngValue]="5">5 / page</option>
          <option [ngValue]="10">10 / page</option>
          <option [ngValue]="20">20 / page</option>
        </select>
      </div>
    </div>
  </div>
</div>
