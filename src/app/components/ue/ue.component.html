<div class="page-wrapper">
  <div class="card modern-card">

    <!-- HEADER -->
    <div class="card-header text-center">
      <div class="icon-circle">
        <i class="bi bi-journal-richtext"></i>
      </div>
      <h3 class="fw-bold mt-2">Gestion des Unités d’Enseignement</h3>
      <p class="text-muted small">
        Création, modification et organisation des UE par semestre
      </p>
    </div>

    <div class="card-body">

      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form mb-3">

        <div class="row g-2">

          <div class="col-md-4">
            <div class="form-floating">
              <input class="form-control" formControlName="code">
              <label>Code UE</label>
            </div>
          </div>

          <div class="col-md-8">
            <div class="form-floating">
              <input class="form-control" formControlName="intitule">
              <label>Intitulé</label>
            </div>
          </div>

          <div class="col-md-3">
            <div class="form-floating">
              <input type="number" class="form-control" formControlName="credit">
              <label>Crédits</label>
            </div>
          </div>

          <div class="col-md-3">
            <div class="form-floating">
              <input type="number" class="form-control" formControlName="coefficient">
              <label>Coefficient</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select" formControlName="semestreId">
                <option [ngValue]="null">Sélectionner un semestre</option>
                <option *ngFor="let s of semestres" [ngValue]="s.id">
                  Semestre {{ s.numero }}
                </option>
              </select>
              <label>Semestre</label>
            </div>
          </div>

        </div>

        <div class="text-end mt-3">
          <button class="btn btn-gradient"
                  type="submit"
                  [disabled]="!canEdit() || loading">
            <i class="bi"
               [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
            {{ editingId ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>

      </form>

      <!-- FILTRES -->
      <div class="filter-panel mb-3">
        <input class="form-control filter-input"
               placeholder="Filtrer UE"
               [(ngModel)]="filterIntitule"
               (input)="applyFilters()"
               name="filterIntitule">

        <select class="form-select filter-input"
                [(ngModel)]="filterSemestreId"
                (change)="loadUes()"
                name="filterSemestre">
          <option [ngValue]="null">Tous les semestres</option>
          <option *ngFor="let s of semestres" [ngValue]="s.id">
            Semestre {{ s.numero }}
          </option>
        </select>
      </div>

      <!-- TABLE -->
      <div class="modern-table">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Code</th>
              <th>Intitulé</th>
              <th>Crédits</th>
              <th>Coef</th>
              <th>Semestre</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let u of filteredUes; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ u.code }}</td>
              <td>{{ u.intitule }}</td>
              <td>{{ u.credit }}</td>
              <td>{{ u.coefficient }}</td>
              <!-- ⚡ Corrected Semestre display -->
              <td>Semestre {{ getSemestreNumero(u.semestre) }}</td>
              <td class="text-end">
                <button class="btn btn-action edit"
                        (click)="edit(u)"
                        [disabled]="!canEdit()">
                  <i class="bi bi-pencil-fill"></i>
                </button>
                <button class="btn btn-action delete"
                        (click)="delete(u.id!)"
                        [disabled]="!canEdit()">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="filteredUes.length === 0">
              <td colspan="7" class="text-center text-muted py-5">
                <i class="bi bi-inbox"></i> Aucune UE trouvée
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
