<div class="page-wrapper">
  <div class="modern-card">

    <!-- HEADER -->
    <div class="card-header text-center">
      <div class="icon-circle mb-1">
        <i class="bi bi-layers-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Gestion des Niveaux</h3>
      <p class="text-muted small">Créez, modifiez et filtrez vos niveaux académiques</p>
    </div>

    <!-- BODY -->
    <div class="card-body">
      <!-- FORMULAIRE -->
      <form [formGroup]="form" (ngSubmit)="save()" class="modern-form mb-3">
        <div class="row g-2">

          <div class="col-md-6">
            <div class="form-floating">
              <textarea class="form-control" formControlName="libelle" placeholder="Description" rows="2"></textarea>
              <label>Description</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select" formControlName="filiereId">
                <option [ngValue]="null">Sélectionner une filière</option>
                <option *ngFor="let f of filieres" [ngValue]="f.id">{{ f.nom }}</option>
              </select>
              <label>Filière</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" formControlName="code" placeholder="Code du niveau" />
              <label>Code du niveau</label>
            </div>
          </div>

        </div>

        <div class="mt-2 text-end">
          <button class="btn btn-gradient btn-lg" type="submit" [disabled]="form.invalid || loading || !canEdit()">
            <i class="bi" [ngClass]="editingId ? 'bi-save-fill' : 'bi-plus-circle-fill'"></i>
            {{ editingId ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>

      <!-- BARRE D’ACTIONS -->
      <div class="filter-panel mb-3 d-flex gap-2 flex-wrap justify-content-between align-items-center">

        <input type="text" class="form-control filter-input"
               placeholder="Rechercher un niveau (code ou description)..."
               [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" />

        <select class="form-select filter-input"
                [(ngModel)]="filterFiliereId"
                (change)="applyFilters()">
          <option [ngValue]="null">Toutes les filières</option>
          <option *ngFor="let f of filieres" [ngValue]="f.id">{{ f.nom }}</option>
        </select>

        <div class="toolbar-actions">
          <button class="btn btn-outline-success" (click)="export('excel')">
            <i class="bi bi-file-earmark-excel-fill me-1"></i> Excel
          </button>
          <button class="btn btn-outline-secondary" (click)="export('csv')">
            <i class="bi bi-filetype-csv me-1"></i> CSV
          </button>
          <button class="btn btn-outline-danger" (click)="export('pdf')">
            <i class="bi bi-file-earmark-pdf-fill me-1"></i> PDF
          </button>
          <label class="btn btn-outline-primary mb-0">
            <i class="bi bi-upload me-1"></i> Importer
            <input type="file" hidden accept=".xlsx,.csv" (change)="importExcel($event)">
          </label>
        </div>

      </div>

      <!-- TABLEAU -->
      <div class="table-container">
        <table class="modern-table align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Filière</th>
              <th>Description</th>
              <th>Code</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let n of pagedNiveaux; let i = index">
              <td>{{ (page - 1) * pageSize + i + 1 }}</td>
              <td><span class="badge-filiere">{{ getFiliereNom(n.filiereId) }}</span></td>
              <td>{{ n.libelle || '-' }}</td>
              <td>{{ n.code }}</td>
              <td class="text-end">
                <button class="btn btn-action edit me-1" (click)="edit(n)" [disabled]="!canEdit()">
                  <i class="bi bi-pencil-fill"></i>
                </button>
                <button class="btn btn-action delete" (click)="delete(n.id!)" [disabled]="!canEdit()">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="pagedNiveaux.length === 0">
              <td colspan="5" class="text-center text-muted py-4">
                <i class="bi bi-inbox-fill me-2"></i> Aucun niveau trouvé
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="d-flex justify-content-between align-items-center mt-3">
        <nav>
          <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="page === 1">
              <button class="page-link" (click)="page = page - 1">Précédent</button>
            </li>
            <li class="page-item disabled">
              <span class="page-link">{{ page }}</span>
            </li>
            <li class="page-item" [class.disabled]="page * pageSize >= filteredNiveaux.length">
              <button class="page-link" (click)="page = page + 1">Suivant</button>
            </li>
          </ul>
        </nav>

        <select class="form-select w-auto" [(ngModel)]="pageSize" (change)="onSearchChange()">
          <option [ngValue]="5">5 / page</option>
          <option [ngValue]="10">10 / page</option>
          <option [ngValue]="20">20 / page</option>
        </select>
      </div>

    </div>
  </div>
</div>
