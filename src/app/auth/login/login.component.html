<div class="login-wrapper">
  <div class="login-card">

    <!-- HEADER -->
    <div class="login-header">
      <div class="logo-circle">
        <i class="bi bi-mortarboard-fill"></i>
      </div>

      <h2 class="app-title">SGES</h2>
      <p class="app-subtitle">
        Système de Gestion des Études Supérieures
      </p>
    </div>

    <!-- FORM -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Adresse email</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope-fill"></i>
          </span>
          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="ex: admin@sges.com"
            [class.is-invalid]="isFieldInvalid('email')"
          />
        </div>

        <small *ngIf="isFieldInvalid('email')" class="error-text">
          Adresse email invalide ou manquante
        </small>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock-fill"></i>
          </span>
          <input
            [type]="hidePassword ? 'password' : 'text'"
            class="form-control"
            formControlName="password"
            placeholder="••••••••"
            [class.is-invalid]="isFieldInvalid('password')"
          />
          <span class="input-group-text toggle-password" (click)="togglePassword()">
            <i class="bi" [ngClass]="hidePassword ? 'bi-eye-fill' : 'bi-eye-slash-fill'"></i>
          </span>
        </div>

        <small *ngIf="isFieldInvalid('password')" class="error-text">
          Mot de passe requis (min. 6 caractères)
        </small>
      </div>

      <!-- ERROR -->
      <div *ngIf="errorMessage" class="alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ errorMessage }}
      </div>

      <!-- BUTTON -->
      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">
          <i class="bi bi-box-arrow-in-right"></i>
          Connexion
        </span>
        <span *ngIf="loading">
          <span class="spinner-border spinner-border-sm"></span>
          Connexion...
        </span>
      </button>

    </form>

    <!-- FOOTER -->
    <div class="login-footer">
      <a routerLink="/forgot-password">
        Mot de passe oublié ?
      </a>
    </div>

  </div>
</div>
