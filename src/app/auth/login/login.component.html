<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card shadow-lg">

    <!-- HEADER -->
    <div class="login-header text-center mb-4">
      <div class="logo-circle mb-3">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h2 class="fw-bold mb-1">SGES</h2>
      <p class="text-muted small">
        Système de Gestion des Études Supérieures
      </p>
    </div>

    <!-- FORM -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- EMAIL -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Adresse email</label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope-fill"></i>
          </span>

          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="email ?"
            [class.is-invalid]="isFieldInvalid('email')"
          />
        </div>

        <div *ngIf="isFieldInvalid('email')" class="invalid-feedback d-block">
          <small *ngIf="loginForm.get('email')?.errors?.['required']">
            L'adresse email est obligatoire
          </small>
          <small *ngIf="loginForm.get('email')?.errors?.['email']">
            Adresse email invalide
          </small>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Mot de passe</label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock-fill"></i>
          </span>

          <input
            [type]="hidePassword ? 'password' : 'text'"
            class="form-control"
            formControlName="password"
            placeholder="Mot de Passe ?"
            [class.is-invalid]="isFieldInvalid('password')"
          />

          <button
            type="button"
            class="input-group-text password-toggle"
            (click)="togglePassword()"
          >
            <i class="bi" [ngClass]="hidePassword ? 'bi-eye-fill' : 'bi-eye-slash-fill'"></i>
          </button>
        </div>

        <div *ngIf="isFieldInvalid('password')" class="invalid-feedback d-block">
          <small *ngIf="loginForm.get('password')?.errors?.['required']">
            Le mot de passe est obligatoire
          </small>
          <small *ngIf="loginForm.get('password')?.errors?.['minlength']">
            Minimum 6 caractères requis
          </small>
        </div>
      </div>

      <!-- ERROR MESSAGE -->
      <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        {{ errorMessage }}
      </div>

      <!-- SUBMIT -->
      <div class="d-grid mt-4">
        <button
          type="submit"
          class="btn btn-primary btn-lg"
          [disabled]="loading"
        >
          <span *ngIf="!loading">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Se connecter
          </span>

          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Connexion...
          </span>
        </button>
      </div>

    </form>

    <!-- FOOTER -->
    <div class="login-footer text-center mt-4">
      <a routerLink="/forgot-password" class="text-decoration-none small">
        <i class="bi bi-key-fill me-1"></i>
        Mot de passe oublié ?
      </a>
    </div>

  </div>
</div>
